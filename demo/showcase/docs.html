<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>designimation — docs</title>
    <script>
      /* Resolve the theme synchronously, before any stylesheet paints — see theme.js for the
         toggle-button mounting logic that runs later, once dataset.theme is already correct. */
      ;(function () {
        var KEY = 'designimation-showcase-theme'
        var theme = null
        try {
          var stored = localStorage.getItem(KEY)
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        if (!theme) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          } catch (e) {
            theme = 'dark'
          }
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <link rel="stylesheet" href="../designimation.css" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./alpine.bundle.js"></script>
  </head>
  <body>
    <header class="site" x-data="siteNav" @keydown.escape.window="closeAll()">
      <strong>designimation</strong>
      <nav x-cloak x-show="!narrow || mobileOpen" @click.outside="mobileOpen = false">
        <div
          class="dsg-nav-dropdown"
          @mouseenter="hoverOpen('docs')"
          @mouseleave="hoverClose('docs')"
          @click.outside="close('docs')"
        >
          <button
            type="button"
            class="dsg-nav-dropdown-trigger"
            aria-haspopup="true"
            :aria-expanded="isOpen('docs') ? 'true' : 'false'"
            @click="toggleDropdown('docs')"
          >
            Docs
          </button>
          <div class="dsg-nav-dropdown-menu" x-cloak x-show="isOpen('docs')">
            <a href="/demo/showcase/docs.html?doc=catalog">Catalog</a>
            <a href="/demo/showcase/docs.html?doc=design">Architecture</a>
          </div>
        </div>

        <div
          class="dsg-nav-dropdown"
          @mouseenter="hoverOpen('reveals-scroll')"
          @mouseleave="hoverClose('reveals-scroll')"
          @click.outside="close('reveals-scroll')"
        >
          <button
            type="button"
            class="dsg-nav-dropdown-trigger"
            :class="{ 'is-active': isActive('reveals.html', 'scroll.html') }"
            aria-haspopup="true"
            :aria-expanded="isOpen('reveals-scroll') ? 'true' : 'false'"
            @click="toggleDropdown('reveals-scroll')"
          >
            Reveals &amp; Scroll
          </button>
          <div class="dsg-nav-dropdown-menu" x-cloak x-show="isOpen('reveals-scroll')">
            <a href="./reveals.html" :aria-current="isActive('reveals.html') ? 'page' : null">Reveals</a>
            <a href="./scroll.html" :aria-current="isActive('scroll.html') ? 'page' : null">Scroll</a>
          </div>
        </div>

        <div
          class="dsg-nav-dropdown"
          @mouseenter="hoverOpen('interactive-data')"
          @mouseleave="hoverClose('interactive-data')"
          @click.outside="close('interactive-data')"
        >
          <button
            type="button"
            class="dsg-nav-dropdown-trigger"
            :class="{ 'is-active': isActive('interactive.html', 'text.html', 'data-hover.html') }"
            aria-haspopup="true"
            :aria-expanded="isOpen('interactive-data') ? 'true' : 'false'"
            @click="toggleDropdown('interactive-data')"
          >
            Interactive &amp; Data
          </button>
          <div class="dsg-nav-dropdown-menu" x-cloak x-show="isOpen('interactive-data')">
            <a href="./interactive.html" :aria-current="isActive('interactive.html') ? 'page' : null"
              >Interactive</a
            >
            <a href="./text.html" :aria-current="isActive('text.html') ? 'page' : null">Text</a>
            <a href="./data-hover.html" :aria-current="isActive('data-hover.html') ? 'page' : null"
              >Data &amp; Hover</a
            >
          </div>
        </div>

        <div
          class="dsg-nav-dropdown"
          @mouseenter="hoverOpen('feedback-chrome')"
          @mouseleave="hoverClose('feedback-chrome')"
          @click.outside="close('feedback-chrome')"
        >
          <button
            type="button"
            class="dsg-nav-dropdown-trigger"
            :class="{ 'is-active': isActive('ambient-feedback.html', 'nav-forms.html') }"
            aria-haspopup="true"
            :aria-expanded="isOpen('feedback-chrome') ? 'true' : 'false'"
            @click="toggleDropdown('feedback-chrome')"
          >
            Feedback &amp; Chrome
          </button>
          <div class="dsg-nav-dropdown-menu" x-cloak x-show="isOpen('feedback-chrome')">
            <a href="./ambient-feedback.html" :aria-current="isActive('ambient-feedback.html') ? 'page' : null"
              >Ambient &amp; Feedback</a
            >
            <a href="./nav-forms.html" :aria-current="isActive('nav-forms.html') ? 'page' : null">Nav &amp; Forms</a>
          </div>
        </div>
      </nav>
      <button
        type="button"
        class="dsg-nav-toggle"
        aria-haspopup="true"
        aria-label="Toggle navigation menu"
        :aria-expanded="mobileOpen ? 'true' : 'false'"
        @click.stop="mobileOpen = !mobileOpen"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </header>

    <main class="doc-main">
      <nav class="doc-switch">
        <a data-doc="catalog" href="?doc=catalog">Catalog</a>
        <a data-doc="design" href="?doc=design">Architecture</a>
      </nav>
      <article id="doc-body" class="doc-body">Loading…</article>
    </main>

    <script src="./markdown.js"></script>
    <script src="./theme.js"></script>
    <script>
      ;(async function () {
        var params = new URLSearchParams(location.search)
        var doc = params.get('doc') === 'design' ? 'design' : 'catalog'

        document.querySelectorAll('.doc-switch a').forEach(function (a) {
          if (a.dataset.doc === doc) a.setAttribute('aria-current', 'page')
        })
        document.title = 'designimation — ' + (doc === 'design' ? 'architecture' : 'catalog')

        var body = document.getElementById('doc-body')
        try {
          // no-store: this fetches whatever's on disk right now. Docs get edited independently of
          // any page reload the browser considers "fresh enough" to skip revalidating.
          var res = await fetch('/docs/' + doc + '.md', { cache: 'no-store' })
          if (!res.ok) throw new Error('HTTP ' + res.status)
          var text = await res.text()
          body.innerHTML = window.renderMarkdown(text)
        } catch (err) {
          body.textContent = 'Could not load docs/' + doc + '.md (' + err.message + ')'
        }
      })()
    </script>
  </body>
</html>
