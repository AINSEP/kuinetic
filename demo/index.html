<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>designimation — demo</title>
    <link rel="stylesheet" href="./designimation.css" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #14110f;
        color: #f5efe8;
      }
      section {
        padding: 3rem 2rem;
      }
      .spacer {
        height: 130vh;
        display: grid;
        place-items: center;
        color: #8a7f76;
      }
      .box {
        width: 140px;
        height: 90px;
        margin: 1rem 0;
        border-radius: 10px;
        background: linear-gradient(135deg, #d2691e, #8b3a1a);
        display: grid;
        place-items: center;
        font-size: 0.8rem;
      }
      ul {
        list-style: none;
        padding: 0;
        display: flex;
        gap: 1rem;
      }

      /* This page carries no showcase chrome (no header, no style.css), so the shared
         docs-nav.js script mounts a minimal standalone bar here instead of prepending into a
         header nav that doesn't exist. */
      .dsg-standalone-nav {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        padding: 0.75rem 2rem;
        background: rgba(20, 17, 15, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid #2a2422;
      }

      .dsg-standalone-nav .dsg-nav-dropdown {
        position: relative;
      }

      .dsg-standalone-nav .dsg-nav-dropdown-trigger {
        font: inherit;
        font-size: 0.9rem;
        color: #cbbfb3;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }

      .dsg-standalone-nav .dsg-nav-dropdown-trigger:hover,
      .dsg-standalone-nav .dsg-nav-dropdown-trigger[aria-expanded='true'] {
        color: #f5efe8;
      }

      .dsg-standalone-nav .dsg-nav-dropdown-menu {
        position: absolute;
        top: calc(100% + 0.7rem);
        left: 0;
        flex-direction: column;
        min-width: 150px;
        background: #1c1815;
        border: 1px solid #2a2422;
        border-radius: 8px;
        padding: 0.35rem;
        box-shadow: 0 10px 28px rgb(0 0 0 / 0.35);
      }

      .dsg-standalone-nav .dsg-nav-dropdown-menu a {
        display: block;
        padding: 0.45rem 0.6rem;
        border-radius: 5px;
        font-size: 0.85rem;
        color: #cbbfb3;
        text-decoration: none;
      }

      .dsg-standalone-nav .dsg-nav-dropdown-menu a:hover,
      .dsg-standalone-nav .dsg-nav-dropdown-menu a:focus-visible {
        color: #f5efe8;
        background: #241f1b;
      }
    </style>
  </head>
  <body>
    <section class="spacer">scroll down</section>

    <section id="stage">
      <div id="onload" class="box" data-dsg="zoom-in 200ms on:load">on:load</div>
      <div id="reveal" class="box" data-dsg="fade-up 400ms">fade-up</div>
      <div id="composed" class="box" data-dsg="slide-up 400ms, blur-in 300ms">composed</div>
      <div id="combo" class="box" data-dsg="fade-up 400ms, blur-in 300ms">combo preset</div>
      <div id="override" class="box" data-dsg="fade-up 400ms distance:80px">override</div>
      <div id="rejected" class="box" data-dsg="fade-up 400ms distance:url(http://evil.test)">
        rejected param
      </div>
      <ul id="stagger" data-dsg-stagger="80ms">
        <li class="box" data-dsg="fade-up 300ms">1</li>
        <li class="box" data-dsg="fade-up 300ms">2</li>
        <li class="box" data-dsg="fade-up 300ms">3</li>
      </ul>
      <div id="hoverable" class="box" data-dsg="zoom-in 200ms on:hover">on:hover</div>
    </section>

    <section id="pin-host" style="height: 200vh">
      <div id="pinned" class="box" data-dsg="pin-section distance:400px">pinned</div>
    </section>

    <section id="story-host" style="height: 200vh">
      <div id="story" data-dsg="scrollytelling-step distance:400px steps:4" style="height: 400px">
        scrollytelling
      </div>
    </section>

    <section>
      <ul id="flip-list" data-dsg="flip-reorder 300ms">
        <li class="box" id="card-a">A</li>
        <li class="box" id="card-b">B</li>
        <li class="box" id="card-c">C</li>
      </ul>
    </section>

    <svg width="0" height="0" style="position: absolute">
      <path id="morph" data-dsg='icon-morph to:"M0,0 L20,0 L20,20 Z"' d="M0,0 L10,0 L10,10 Z" />
    </svg>

    <section class="spacer">end</section>

    <script src="./designimation.js"></script>
    <script>
      window.__dsg = designimation
        .designimation({ reporter: designimation.consoleReporter() })
        .start()
      window.__caps = designimation.detect()
    </script>
    <script src="./showcase/docs-nav.js"></script>
  </body>
</html>
