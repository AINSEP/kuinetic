<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kuinetic — deck-motion-freeze fixture</title>
    <link rel="stylesheet" href="../../../demo/kuinetic.css" />
    <style>
      /* Page chrome only. Nothing here positions or transforms a card. */
      body {
        margin: 0;
        padding: 16px;
        background: #14110f;
        color: #f5efe8;
        font-family: system-ui, sans-serif;
      }
      section {
        margin-block: 48px 160px;
      }
      .deck {
        width: 200px;
        height: 140px;
        display: grid;
        place-items: center;
        background: #2a2521;
        border: 1px solid #e4f222;
      }
    </style>
  </head>
  <body>
    <section>
      <div id="stack" data-kui="carousel-stack autoplay:2s target:.deck">
        <div class="deck">1</div>
        <div class="deck">2</div>
        <div class="deck">3</div>
        <div class="deck">4</div>
        <div class="deck">5</div>
      </div>
    </section>
    <section>
      <div id="stack-unhovered" data-kui="carousel-stack autoplay:2s hover:none target:.deck">
        <div class="deck">1</div>
        <div class="deck">2</div>
        <div class="deck">3</div>
        <div class="deck">4</div>
        <div class="deck">5</div>
      </div>
    </section>
    <script src="../../../demo/kuinetic.js"></script>
    <script>
      window.__kui = kuinetic.kuinetic({ reporter: kuinetic.silentReporter() }).start()
    </script>
  </body>
</html>
