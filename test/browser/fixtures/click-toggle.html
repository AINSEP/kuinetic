<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kuinetic — click-toggle fixture</title>
    <link rel="stylesheet" href="../../../demo/kuinetic.css" />
    <style>
      body {
        margin: 0;
        background: #14110f;
        color: #f5efe8;
        font-family: system-ui, sans-serif;
        padding: 2rem;
      }
      #card {
        perspective: 1200px;
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, #d2691e, #8b3a1a);
      }
    </style>
  </head>
  <body>
    <div id="card" data-kui="card-flip-y 120ms" data-kui-on="click" tabindex="0">flip</div>

    <script src="../../../demo/kuinetic.js"></script>
    <script>
      window.__kui = kuinetic.kuinetic({ reporter: kuinetic.consoleReporter() }).start()
    </script>
  </body>
</html>
